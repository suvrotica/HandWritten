<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwriting Blog Editor</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <!-- Component placeholders that will be populated by JavaScript -->
    <div id="header-container"></div>

    <div class="container">
        <input type="text" class="blog-title" placeholder="Enter your blog title...">
        
        <div id="btn-row-container"></div>
        <div id="toolbar-container"></div>
        <div id="canvas-container"></div>
        <div id="page-controls-container"></div>
        <div id="preview-container"></div>
    </div>

    <div class="toast" id="toast">Changes saved!</div>

    <!-- Load utility modules first -->
    <script src="/script/utils.js"></script>
    
    <!-- Load feature modules -->
    <script src="/script/canvas-handler.js"></script>
    <script src="/script/rotation-handler.js"></script>
    <script src="/script/page-manager.js"></script>
    <script src="/script/export-manager.js"></script>
    <script src="/script/ui-controller.js"></script>
    
    <!-- Load component loader, then main script -->
    <script src="/script/components.js"></script>
    <script src="/script/script.js"></script>
</body>
</html>
